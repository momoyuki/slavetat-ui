<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
/* ── Base ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{width:100vw;height:100vh;background:transparent;overflow:hidden;
  font-family:'Segoe UI',sans-serif;color:#e8e8e8;font-size:12px}

/* ── App ── */
.app{
  position:fixed;right:0;top:0;
  width:520px;height:100vh;
  background:#0a0a0a;
  border-left:1px solid #222;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:-4px 0 32px rgba(0,0,0,0.9);
  user-select:none;
}
.app.dragging{opacity:.92}

/* ── Header ── */
header{
  background:#101010;
  padding:7px 10px;
  border-bottom:1px solid #222;
  display:flex;align-items:center;gap:7px;flex-shrink:0;
  cursor:move;
}
header h1{font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0}
.actor-bar{display:flex;gap:5px;align-items:center;flex:1;min-width:0}
.actor-bar label{font-size:10px;color:#555;white-space:nowrap}
.actor-bar select{
  flex:1;min-width:0;max-width:120px;
  background:#111;border:1px solid #282828;
  border-radius:3px;color:#bbb;font-size:11px;padding:2px 4px;
}
.api-badge{
  font-size:9px;padding:2px 6px;border-radius:3px;
  border:1px solid #1a2a1a;background:#0a180a;color:#4a8a4a;
  white-space:nowrap;flex-shrink:0;
}
.api-badge.err{border-color:#3a1a1a;background:#180a0a;color:#8a4a4a}
.btn-hdr{
  padding:5px 11px;font-size:11px;border-radius:3px;
  border:1px solid #252525;cursor:pointer;background:#141414;color:#666;
  white-space:nowrap;flex-shrink:0;
}
.btn-hdr:hover{background:#1e1e1e;color:#aaa}

/* ── View Stack ── */
#viewStack{flex:1;overflow:hidden;position:relative}
.view{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  transform:translateX(100%);
  transition:transform .18s ease;
  overflow:hidden;
  pointer-events:none;
  background:#0a0a0a;
}
.view.active{transform:translateX(0);pointer-events:all}
.view.behind {transform:translateX(-100%);pointer-events:none}

/* ── View Nav ── */
.view-nav{
  display:flex;align-items:center;gap:8px;
  padding:5px 10px;
  background:#0c0c0c;
  border-bottom:1px solid #1a1a1a;flex-shrink:0;
}
.btn-back{
  padding:5px 12px;font-size:12px;border-radius:3px;
  border:1px solid #252525;cursor:pointer;background:#141414;color:#777;
}
.btn-back:hover{background:#1e1e1e;color:#ccc}
.view-title{font-size:12px;font-weight:600;color:#aaa;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Slot Grid View ── */
#slotScrollArea{overflow-y:auto;height:100%;padding:6px 8px 50px}

/* ── Area Section ── */
.area-section{margin-bottom:5px}
.area-hdr{
  display:flex;align-items:center;gap:6px;
  padding:5px 8px;cursor:pointer;border-radius:4px;
  background:rgba(255,255,255,.02);border:1px solid #1c1c1c;margin-bottom:4px;
}
.area-hdr:hover{background:rgba(255,255,255,.05)}
.area-arrow{font-size:8px;color:#3a3a3a;width:9px;flex-shrink:0}
.area-label{font-size:11px;font-weight:700;letter-spacing:.5px;color:#888;flex:1}
.area-count{font-size:10px;color:#444}
.area-loading{font-size:9px;color:#333}

/* ── Slot Grid (2-col) ── */
.slot-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:0 2px}

/* ── Slot Cell ── */
.slot-cell{
  display:flex;flex-direction:column;
  border-radius:5px;border:1px solid #1a1a1a;background:#0e0e0e;
  min-width:0;overflow:hidden;cursor:pointer;
  transition:background .1s,border-color .1s;
}
/* Thumb area — full width, fixed height, same for all states */
.sc-thumb-wrap{
  width:100%;height:100px;flex-shrink:0;position:relative;
  background:#141414;overflow:hidden;
}
.sc-thumb{width:100%;height:100%;display:block;image-rendering:pixelated}
/* Text area below thumb */
.sc-body{padding:6px 8px 7px;display:flex;flex-direction:column;gap:2px}
.sc-num{font-size:10px;color:#333;line-height:1}
.sc-name{
  font-size:11px;width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  line-height:1.4;color:#555;
}
.sc-section{
  font-size:9px;width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#333;
}
.sc-color{width:100%;height:3px;margin-top:3px;border-radius:2px}

.slot-cell.occupied{background:#0c0c18;border-color:#1c1c2e}
.slot-cell.occupied:hover{background:#121228;border-color:#3a3a6a}
.slot-cell.occupied .sc-thumb-wrap{background:#1a1a2a}
.slot-cell.occupied .sc-num{color:#3a3a6a}
.slot-cell.occupied .sc-name{color:#7a7aaa}

.slot-cell.free{background:#0b140b;border-color:#152015}
.slot-cell.free .sc-thumb-wrap{background:#0e1a0e}
.slot-cell.free .sc-num{color:#233a23}
.slot-cell.free .sc-name{color:#2a5a2a}
.slot-cell.free:hover{background:#0f1f0f;border-color:#285028}
.slot-cell.free:hover .sc-name{color:#4a9a4a}

.slot-cell.ext-occupied{background:#161200;border-color:#2a2200;cursor:default}
.slot-cell.ext-occupied .sc-thumb-wrap{background:#1a1600}
.slot-cell.ext-occupied .sc-num{color:#3a2800}
.slot-cell.ext-occupied .sc-name{color:#554400}

/* ── Browser in-use badges (Feature 1) ── */
.grid-item.in-use{border-color:#4a3200}
.grid-item.in-use-current{border-color:#c09000}
.slot-badges{position:absolute;bottom:3px;right:3px;display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end;max-width:90%}
.slot-badge{font-size:8px;padding:1px 4px;border-radius:2px;background:rgba(140,90,0,.85);color:#ffd;line-height:1.4;white-space:nowrap}
.slot-badge.current{background:rgba(200,140,0,.95);color:#fff;font-weight:700}

/* ── Edit View ── */
.view-body{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
/* Edit view overrides view-body to be a full preview */
#view-edit .view-body{padding:0;overflow:hidden;gap:0}
.edit-preview-wrap{
  flex:1;min-height:0;position:relative;
  background:#141414;overflow:hidden;
}
.edit-preview-wrap canvas{
  position:absolute;inset:0;width:100%;height:100%;
  image-rendering:pixelated;
}
.edit-info{padding:8px 12px;flex-shrink:0;display:flex;flex-direction:column;gap:2px}
/* Edit bottom panel — mirrors browser-panel position */
.edit-panel{
  flex-shrink:0;background:#0c0c0c;
  border-top:1px solid #242424;padding:8px 10px;
  display:flex;flex-direction:column;gap:7px;
}
.edit-actions{display:flex;gap:6px}
.edit-thumb-wrap{
  flex-shrink:0;width:80px;height:80px;
  border-radius:4px;overflow:hidden;
  background:#b0b0b0;border:1px solid #1a1a1a;position:relative;
}
.edit-info{display:flex;flex-direction:column;gap:4px;min-width:0;justify-content:center}
.edit-tattoo-name{font-size:12px;font-weight:600;color:#ccc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.edit-tattoo-meta{font-size:10px;color:#555}
.field-label{font-size:10px;color:#444;margin-bottom:4px}

/* ── Remove Banner ── */
.remove-banner{
  margin:0 12px 8px;padding:8px 10px;
  background:#180a0a;border:1px solid #3a1010;border-radius:4px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-shrink:0;
}
.remove-warning{flex:1;font-size:11px;color:#c55}

/* ── Browser Filter ── */
.browser-filter{
  display:flex;gap:5px;align-items:center;
  padding:5px 10px;
  background:#0a0a0a;
  border-bottom:1px solid #161616;flex-shrink:0;
}
.area-chip{
  padding:2px 8px;font-size:10px;font-weight:700;border-radius:3px;
  background:#12303a;border:1px solid #1a5a6a;color:#8ad;
  white-space:nowrap;letter-spacing:.5px;flex-shrink:0;
  transition:opacity .15s;
}
.btn-chip{
  padding:2px 8px;font-size:10px;border-radius:3px;
  border:1px solid #222;cursor:pointer;background:#111;color:#555;
  white-space:nowrap;flex-shrink:0;
}
.btn-chip:hover{background:#1a1a1a;color:#888}
.btn-chip.active{background:#122012;border-color:#285028;color:#6a9a6a}
.browser-filter input{
  flex:1;background:#111;border:1px solid #242424;
  border-radius:3px;color:#e8e8e8;font-size:11px;padding:4px 8px;
}
.browser-filter input::placeholder{color:#2a2a2a}
.browser-filter input:focus{outline:1px solid #333}

/* ── Browser List ── */
.browser-list{flex:1;overflow-y:auto;padding:6px 10px}
/* ── Browser Footer (persistent Back) ── */
.browser-footer{
  flex-shrink:0;display:flex;justify-content:flex-end;
  padding:6px 10px;background:#0c0c0c;border-top:1px solid #1a1a1a;
}

/* ── Browser Bottom Panel ── */
.browser-panel{
  flex-shrink:0;background:#0c0c0c;
  border-top:1px solid transparent;
  display:flex;flex-direction:column;gap:7px;
  max-height:0;padding:0 10px;overflow:hidden;
  transition:max-height .25s ease, padding .22s ease, border-top-color .15s;
}
.browser-panel:not(.inactive){
  max-height:480px;
  padding:8px 10px;
  border-top-color:#242424;
}
.panel-tattoo-row{display:flex;gap:8px;align-items:center}
.panel-thumb-wrap{
  flex-shrink:0;width:46px;height:46px;
  border-radius:3px;overflow:hidden;
  background:#b0b0b0;border:1px solid #222;position:relative;
}
.panel-tattoo-name{font-size:11px;font-weight:600;color:#ccc}
.panel-tattoo-section{font-size:9px;color:#444;margin-top:2px}
.panel-controls{display:flex;flex-direction:column;gap:6px}

/* ── Tree ── */
.tree-node{display:flex;flex-direction:column}
.tree-hdr{
  display:flex;align-items:center;gap:5px;
  padding:4px 6px;cursor:pointer;border-radius:3px;
}
.tree-hdr:hover{background:rgba(255,255,255,.04)}
.tree-arrow{font-size:8px;color:#2a2a2a;width:9px;flex-shrink:0}
.tree-label{font-size:12px;font-weight:600;color:#888;flex:1}
.tree-sub-label{font-size:11px;color:#666;flex:1;padding-left:2px}
.badge{
  font-size:9px;background:#111;border:1px solid #1e1e1e;
  border-radius:8px;padding:1px 5px;color:#3a3a3a;
}
.tree-children{padding-left:10px;display:flex;flex-direction:column;gap:2px}

/* ── Tattoo Grid ── */
.tat-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:4px 2px 6px}
.grid-item{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  background:rgba(255,255,255,.018);border:1px solid #181818;
  border-radius:5px;padding:6px;min-width:0;
  cursor:pointer;transition:background .1s,border-color .1s;
}
.grid-item:hover,.grid-item.selected{background:rgba(255,255,255,.06);border-color:#365a36}
.grid-item.selected{border-color:#4a8a4a}
.tat-thumb-wrap{
  flex-shrink:0;width:100px;height:100px;
  border-radius:4px;overflow:hidden;
  background:#b0b0b0;border:1px solid #1a1a1a;position:relative;
}
.tat-thumb{width:100px;height:100px;display:block;image-rendering:pixelated}
.tat-thumb-sm{display:block;image-rendering:pixelated}
.tat-thumb-ph{
  position:absolute;inset:0;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:3px;
}
.tat-thumb-ph .ph-icon{font-size:22px;opacity:.1}
.tat-thumb-ph .ph-err{font-size:7px;color:#5a2a2a;text-align:center;padding:0 3px;word-break:break-all}
.panel-thumb{width:46px;height:46px;display:block;image-rendering:pixelated}
.grid-name{
  font-size:10px;font-weight:500;color:#a0a0a0;
  text-align:center;width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* ── Color Picker ── */
.palette-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.pal-swatch{
  width:100%;aspect-ratio:1;border-radius:3px;cursor:pointer;
  border:2px solid transparent;transition:transform .1s,border-color .1s;
}
.pal-swatch:hover{transform:scale(1.12)}
.pal-swatch.selected{border-color:#fff}
.color-row{display:flex;gap:7px;align-items:center}
.color-preview{width:30px;height:30px;border-radius:3px;border:1px solid #2a2a2a;flex-shrink:0}
.hex-input{
  flex:1;background:#111;border:1px solid #242424;
  border-radius:3px;color:#e8e8e8;font-size:11px;
  font-family:monospace;padding:5px 7px;
}
.hex-input:focus{outline:1px solid #333}
.alpha-row{display:flex;align-items:center;gap:8px}
.alpha-row input[type=range]{flex:1;accent-color:#9a3a1e;cursor:pointer}
.alpha-val{font-size:11px;color:#777;min-width:30px;text-align:right;font-family:monospace}

/* ── Buttons ── */
.btn{
  padding:7px 14px;font-size:12px;border-radius:4px;
  border:1px solid #2e2e2e;cursor:pointer;background:#181818;color:#bbb;
  white-space:nowrap;
}
.btn:hover{background:#242424}
.btn.primary{background:#7a2a0e;border-color:#9a3a1e;color:#fff}
.btn.primary:hover{background:#9a3a1e}
.btn.sm{padding:4px 10px;font-size:11px}
.btn.danger{border-color:#3a0a0a;color:#b44}
.btn.danger:hover{background:#3a0e0e;border-color:#6a1818;color:#f77}
.btn:disabled{opacity:.3;cursor:default;pointer-events:none}
.btn-full{width:100%}

/* ── Bottom bar ── */
.bottom-bar{
  display:flex;align-items:center;padding:3px 10px;
  background:#050505;border-top:1px solid #111;flex-shrink:0;
}
#statusbar{flex:1;font-size:10px;color:#282828}
#statusbar.ok  {color:#2a8}
#statusbar.err {color:#a44}
#statusbar.busy{color:#668}
.count-badge{font-size:9px;color:#2a2a2a;white-space:nowrap}

.empty{text-align:center;padding:28px;color:#222;font-size:11px}
</style>
</head>
<body>
<div class="app" id="app">

<!-- ── Header ── -->
<header>
  <h1>SlaveTats UI</h1>
  <div class="actor-bar">
    <label>Actor</label>
    <select id="actorSelect" onchange="onActorChange()">
      <option value="0x14">Player</option>
    </select>
    <button class="btn-hdr" onclick="refreshActors()" title="Scan NPCs">&#8635;</button>
  </div>
  <span id="apiBadge" class="api-badge" style="display:none"></span>
  <button class="btn-hdr" onclick="syncTattoos()">Sync</button>
  <button class="btn-hdr" onclick="sendCmd({action:'toggleUI'})">&#x2715;</button>
</header>

<!-- ── View Stack ── -->
<div id="viewStack">

  <!-- Slot Grid View -->
  <div id="view-slots" class="view active">
    <div id="slotScrollArea"></div>
  </div>

  <!-- Edit View -->
  <div id="view-edit" class="view">
    <div class="view-nav">
      <span class="view-title" id="editViewTitle">Slot N &middot; AREA</span>
    </div>
    <div class="view-body">
      <div class="edit-preview-wrap">
        <canvas id="editThumb" width="256" height="256" style="opacity:0"></canvas>
        <div class="tat-thumb-ph">
          <div class="ph-icon">&#128444;</div>
          <div class="ph-err"></div>
        </div>
      </div>
      <div class="edit-info">
        <div class="edit-tattoo-name" id="editTattooName">&mdash;</div>
        <div class="edit-tattoo-meta" id="editTattooMeta"></div>
      </div>
    </div>
    <div id="removeBanner" class="remove-banner" style="display:none"></div>
    <div class="edit-panel">
      <div class="palette-grid" id="editPalette"></div>
      <div class="color-row">
        <div class="color-preview" id="editColorPreview" style="background:#ffffff"></div>
        <input class="hex-input" id="editHex" type="text" maxlength="7" placeholder="#FFFFFF"
          oninput="onHexInput('edit')">
        <button class="btn sm" onclick="resetEditColor()" title="Reset">&#8634;</button>
      </div>
      <div class="alpha-row">
        <input type="range" min="0" max="100" value="100" id="editAlphaSlider"
          oninput="onAlphaSlider('edit')">
        <span class="alpha-val" id="editAlphaVal">1.00</span>
      </div>
      <div class="edit-actions">
        <button class="btn primary" onclick="confirmSave()">Save</button>
        <button class="btn" onclick="openReplace()">Replace</button>
        <button class="btn danger" onclick="startRemove()">Remove</button>
        <button class="btn" style="margin-left:auto" onclick="popView()">&larr; Back</button>
      </div>
    </div>
  </div>

  <!-- Browser View -->
  <div id="view-browser" class="view">
    <div class="view-nav">
      <span class="view-title" id="browserViewTitle">Select Tattoo</span>
    </div>
    <div class="browser-filter">
      <span class="area-chip" id="browserAreaChip">BODY</span>
      <button class="btn-chip" id="showAllBtn" onclick="toggleShowAll()">Show All</button>
      <input id="browserSearch" type="text" placeholder="Search&hellip;" oninput="debouncedRenderBrowser()">
    </div>
    <div id="browserList" class="browser-list">
      <div class="empty">Loading tattoos&hellip;</div>
    </div>
    <div id="browserPanel" class="browser-panel inactive">
      <div class="panel-tattoo-row">
        <div class="panel-thumb-wrap">
          <canvas id="browserThumb" class="panel-thumb" width="46" height="46" style="opacity:0"></canvas>
          <div class="tat-thumb-ph"><div class="ph-icon" style="font-size:14px">&#128444;</div></div>
        </div>
        <div>
          <div class="panel-tattoo-name" id="panelTattooName">&mdash;</div>
          <div class="panel-tattoo-section" id="panelTattooSection"></div>
        </div>
      </div>
      <div class="panel-controls">
        <div class="palette-grid" id="browserPalette"></div>
        <div class="color-row">
          <div class="color-preview" id="browserColorPreview" style="background:#ffffff"></div>
          <input class="hex-input" id="browserHex" type="text" maxlength="7" value="#FFFFFF"
            oninput="onHexInput('browser')">
          <button class="btn sm" onclick="setColor('browser',0xFFFFFF)" title="Reset">&#8634;</button>
        </div>
        <div class="alpha-row">
          <input type="range" min="0" max="100" value="100" id="browserAlphaSlider"
            oninput="onAlphaSlider('browser')">
          <span class="alpha-val" id="browserAlphaVal">1.00</span>
        </div>
      </div>
      <button class="btn primary btn-full" id="applySlotBtn" onclick="confirmApplyToSlot()">Apply to Slot &mdash;</button>
    </div>
    <div class="browser-footer">
      <button class="btn" onclick="popView()">&larr; Back</button>
    </div>
  </div>

</div><!-- /viewStack -->

<div class="bottom-bar">
  <div id="statusbar">Ready</div>
  <div class="count-badge" id="countBadge"></div>
</div>
</div><!-- /app -->

<script>
// ─── Palette ─────────────────────────────────────────────────────────────────
var SKYUI_PALETTE=[
  {n:'White',    h:'#FFFFFF'},{n:'Silver',    h:'#C8C8C8'},
  {n:'Gray',     h:'#969696'},{n:'Black',     h:'#282828'},
  {n:'Red',      h:'#FF0000'},{n:'Dark Red',  h:'#960000'},
  {n:'Orange',   h:'#FF6400'},{n:'Brown',     h:'#964600'},
  {n:'Yellow',   h:'#FFFF00'},{n:'Olive',     h:'#969600'},
  {n:'Lime',     h:'#64FF00'},{n:'Green',     h:'#008200'},
  {n:'Aqua',     h:'#00FFFF'},{n:'Teal',      h:'#008282'},
  {n:'Sky',      h:'#64C8FF'},{n:'Blue',      h:'#0000FF'},
  {n:'Navy',     h:'#000096'},{n:'Violet',    h:'#9600FF'},
  {n:'Purple',   h:'#460096'},{n:'Magenta',   h:'#FF00FF'},
  {n:'Pink',     h:'#FF82C8'},{n:'Rose',      h:'#FF1482'},
  {n:'Pale',     h:'#FFDCC8'},{n:'Peach',     h:'#F0B496'},
  {n:'Tan',      h:'#C87832'},{n:'Chocolate', h:'#784614'},
  {n:'Gold',     h:'#FFD200'},{n:'Steel',     h:'#8296AA'},
];

// ─── State ───────────────────────────────────────────────────────────────────
var AREAS=['BODY','FACE','HANDS','FEET'];
var allSlotsData   ={};
var areaCollapsed  ={};
var availableTattoos=[];
var availableDomain='default';
var tattooByHandle ={};
var expanded       ={};

var viewStack=['slots'];
var ctxArea='',ctxSlot=-1,ctxHandle=0,ctxIsReplace=false;
var editColor=0xFFFFFF,editOrigColor=0xFFFFFF,editAlphaV=1,editOrigAlpha=1;
var browserShowAll=false,browserSelectedHandle=0,browserColor=0xFFFFFF,browserAlphaV=1;
var slotUsageMap={}; // key:"section:name" → [slot,...] for ctxArea

// ─── Navigation ───────────────────────────────────────────────────────────────
function pushView(name){
  var prev=viewStack[viewStack.length-1];
  viewStack.push(name);
  if(prev){var el=document.getElementById('view-'+prev);if(el){el.classList.remove('active');el.classList.add('behind');}}
  var el=document.getElementById('view-'+name);
  if(el){el.classList.remove('behind');el.classList.add('active');}
}
function popView(){
  if(viewStack.length<=1)return;
  var cur=viewStack.pop();
  var prev=viewStack[viewStack.length-1];
  var curEl=document.getElementById('view-'+cur);
  var prevEl=document.getElementById('view-'+prev);
  if(curEl)curEl.classList.remove('active');
  if(prevEl){prevEl.classList.remove('behind');prevEl.classList.add('active');}
}
var _removeBusy=false;
function resetToSlots(){
  _removeBusy=false;
  // Bypass CSS transitions to avoid blank-frame artifact on rapid navigation
  var allViews=document.querySelectorAll('#viewStack .view');
  for(var i=0;i<allViews.length;i++){
    allViews[i].style.transition='none';
    allViews[i].classList.remove('active','behind');
  }
  viewStack=['slots'];
  var slotsEl=document.getElementById('view-slots');
  if(slotsEl)slotsEl.classList.add('active');
  requestAnimationFrame(function(){
    var vs=document.querySelectorAll('#viewStack .view');
    for(var i=0;i<vs.length;i++)vs[i].style.transition='';
  });
}
function currentView(){return viewStack[viewStack.length-1];}

// ─── PrismaUI interop ─────────────────────────────────────────────────────────
function slavetatsOnData(jsonStr){
  var d;
  try{d=JSON.parse(jsonStr);}catch(e){setStatus('JSON error','err');return;}
  switch(d.type){
    case 'ready':
      showAPIBadge(d.apiVersion,d.apiOk!==false);
      setStatus('Connected','ok');
      refreshActors();
      fetchAvailable();
      break;
    case 'show':
      refreshAllSlots();
      break;
    case 'available':
      availableDomain=d.domain||'default';
      availableTattoos=d.tattoos||[];
      tattooByHandle={};
      for(var i=0;i<availableTattoos.length;i++){var t=availableTattoos[i];if(t.handle)tattooByHandle[t.handle]=t;}
      document.getElementById('countBadge').textContent=availableTattoos.length+' available';
      if(currentView()==='browser')renderBrowser();
      break;
    case 'actors':
      onActorsData(d.actors||[]);
      break;
    case 'slots':
      onSlotsData(d);
      break;
    case 'success':
      setStatus('Done','ok');
      refreshAllSlots();
      if(d.action==='removeFromSlot'||d.action==='applyToSlot'||d.action==='updateTattoo')
        resetToSlots();
      break;
    case 'error':
      _removeBusy=false;
      setStatus(d.message||'Error','err');
      break;
    case 'texture':
      onTextureData(d.path,d.w||128,d.h||128,d.data);
      break;
    case 'textureError':
      onTextureError(d.path);
      break;
  }
}
function sendCmd(obj){
  try{slavetatsCmd(JSON.stringify(obj));}
  catch(e){setStatus('Bridge not ready','err');}
}

// ─── Commands ─────────────────────────────────────────────────────────────────
function refreshActors(){sendCmd({action:'queryActors'});}
function fetchAvailable(){sendCmd({action:'queryAvailable',domain:'default'});}
function syncTattoos(){sendCmd({action:'syncTattoos',actorId:getActorId()});setStatus('Syncing…','busy');}
function onActorChange(){refreshAllSlots();}
function getActorId(){return parseInt(document.getElementById('actorSelect').value,16)||0x14;}
function refreshAllSlots(){sendCmd({action:'queryAllSlots',actorId:getActorId()});setStatus('Loading…','busy');}

function onActorsData(actors){
  var sel=document.getElementById('actorSelect');
  var cur=sel.value;
  sel.innerHTML='';
  for(var i=0;i<actors.length;i++){
    var a=actors[i];

// ─── Slot data ────────────────────────────────────────────────────────────────
function onSlotsData(d){
  allSlotsData[d.area]={slots:d.slots||[],maxSlots:d.maxSlots||0};
  updateAreaSection(d.area);
  var allDone=true;
  for(var i=0;i<AREAS.length;i++){if(!allSlotsData[AREAS[i]]){allDone=false;break;}}
  if(allDone)setStatus('Ready','');
}

function updateAreaSection(area){
  var existing=document.getElementById('area-sec-'+area);
  var node=buildAreaSection(area);
  if(existing)existing.parentNode.replaceChild(node,existing);
  else document.getElementById('slotScrollArea').appendChild(node);
}

function buildAreaSection(area){
  var collapsed=!!areaCollapsed[area];
  var data=allSlotsData[area];
  var occCount=0;
  if(data)for(var i=0;i<data.slots.length;i++){if(data.slots[i].occupied&&!data.slots[i].external)occCount++;}
  var maxSlots=data?data.maxSlots:'?';

  var sec=document.createElement('div');
  sec.className='area-section';sec.id='area-sec-'+area;

  var hdr=document.createElement('div');
  hdr.className='area-hdr';
  (function(a){hdr.onclick=function(){areaCollapsed[a]=!areaCollapsed[a];updateAreaSection(a);};})(area);
  hdr.innerHTML=
    '<span class="area-arrow">'+(collapsed?'&#9658;':'&#9660;')+'</span>'+
    '<span class="area-label">'+esc(area)+'</span>'+
    '<span class="area-count">'+(data?occCount+'/'+maxSlots:'')+'</span>'+
    (!data?'<span class="area-loading">Loading…</span>':'');
  sec.appendChild(hdr);

  if(!collapsed&&data){
    var grid=document.createElement('div');
    grid.className='slot-grid-2';
    for(var i=0;i<data.slots.length;i++)grid.appendChild(buildSlotCell(area,data.slots[i]));
    sec.appendChild(grid);
  }
  return sec;
}

function buildSlotCell(area,s){
  var cell=document.createElement('div');
  var phHtml='<div class="tat-thumb-ph" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">'+
    '<div class="ph-icon" style="font-size:28px;opacity:.07">&#128444;</div></div>';
  if(s.external){
    cell.className='slot-cell ext-occupied';
    cell.title='Used by another mod';
    cell.innerHTML=
      '<div class="sc-thumb-wrap">'+phHtml+'</div>'+
      '<div class="sc-body">'+
        '<div class="sc-num">Slot '+s.slot+'</div>'+
        '<div class="sc-name">External</div>'+
      '</div>';
  }else if(s.occupied){
    var hex=intToHex((s.color&&s.color!==0)?s.color:0xFFFFFF);
    cell.className='slot-cell occupied';
    cell.title=(s.name||'')+(s.section?' — '+s.section:'');
    (function(a,sl){cell.onclick=function(){openEditView(a,sl);};})(area,s);
    var texAttr=s.texture?' data-tex="'+esc(s.texture)+'"':'';
    cell.innerHTML=
      '<div class="sc-thumb-wrap">'+
        '<canvas class="sc-thumb"'+texAttr+' style="opacity:0"></canvas>'+
        phHtml+
      '</div>'+
      '<div class="sc-body">'+
        '<div class="sc-num">Slot '+s.slot+'</div>'+
        '<div class="sc-name">'+esc(s.name||'?')+'</div>'+
        '<div class="sc-section">'+esc(s.section||'')+'</div>'+
        '<div class="sc-color" style="background:'+hex+'"></div>'+
      '</div>';
    if(s.texture){
      var canvas=cell.querySelector('.sc-thumb');
      if(canvas)thumbObserver.observe(canvas);
    }
  }else{
    cell.className='slot-cell free';
    (function(a,si){cell.onclick=function(){openBrowserView(a,si,false);};})(area,s.slot);
    cell.innerHTML=
      '<div class="sc-thumb-wrap">'+phHtml+'</div>'+
      '<div class="sc-body">'+
        '<div class="sc-num">Slot '+s.slot+'</div>'+
        '<div class="sc-name">+ Select Tattoo</div>'+
      '</div>';
  }
  return cell;
}

// ─── Browser View ─────────────────────────────────────────────────────────────
function openBrowserView(area,slot,isReplace){
  ctxArea=area;ctxSlot=slot;ctxIsReplace=isReplace;
  browserShowAll=false;browserSelectedHandle=0;
  browserColor=0xFFFFFF;browserAlphaV=1;

  document.getElementById('browserViewTitle').textContent=isReplace?'Replace Tattoo':'Select Tattoo';
  document.getElementById('browserAreaChip').textContent=area;
  document.getElementById('browserAreaChip').style.opacity='1';
  document.getElementById('showAllBtn').classList.remove('active');
  document.getElementById('applySlotBtn').textContent='Apply to Slot '+slot;
  document.getElementById('browserSearch').value='';
  document.getElementById('browserPanel').classList.add('inactive');
  var _bt=document.getElementById('browserThumb');_bt.style.opacity='0';
  setColor('browser',0xFFFFFF);setAlpha('browser',1);

  renderBrowser();
  pushView('browser');
}
function toggleShowAll(){
  browserShowAll=!browserShowAll;
  document.getElementById('showAllBtn').classList.toggle('active',browserShowAll);
  document.getElementById('browserAreaChip').style.opacity=browserShowAll?'.4':'1';
  renderBrowser();
}
var _browserSearchTimer=null;
function debouncedRenderBrowser(){clearTimeout(_browserSearchTimer);_browserSearchTimer=setTimeout(renderBrowser,150);}
function renderBrowser(){
  // Build in-use map: section:name → [slot,...] for current area
  slotUsageMap={};
  var areaData=allSlotsData[ctxArea];
  if(areaData){
    for(var i=0;i<areaData.slots.length;i++){
      var s=areaData.slots[i];
      if(s.occupied&&!s.external&&s.name){
        var k=(s.section||'')+':'+s.name;
        if(!slotUsageMap[k])slotUsageMap[k]=[];
        slotUsageMap[k].push(s.slot);
      }
    }
  }
  var q=document.getElementById('browserSearch').value.toLowerCase();
  var list=availableTattoos.slice();
  if(!browserShowAll&&ctxArea)
    list=list.filter(function(t){return(t.area||'').toUpperCase()===ctxArea;});
  if(q)
    list=list.filter(function(t){
      return(t.name||'').toLowerCase().indexOf(q)>=0||(t.section||'').toLowerCase().indexOf(q)>=0;
    });

  var container=document.getElementById('browserList');
  if(!list.length){
    container.innerHTML=availableTattoos.length?'<div class="empty">No matches</div>':'<div class="empty">Loading…</div>';
    return;
  }
  renderTree(container,buildTree(list));
}
function selectBrowserTattoo(handle){
  browserSelectedHandle=handle;
  var t=tattooByHandle[handle];
  if(!t)return;
  document.getElementById('panelTattooName').textContent=t.name||'—';
  document.getElementById('panelTattooSection').textContent=t.section||'';
  var canvas=document.getElementById('browserThumb');
  canvas.style.opacity='0';
  if(t.texture){canvas.dataset.tex=t.texture;loadThumb(canvas);}
  document.getElementById('browserPanel').classList.remove('inactive');
  var items=document.querySelectorAll('#browserList .grid-item');
  for(var i=0;i<items.length;i++)
    items[i].classList.toggle('selected',parseInt(items[i].getAttribute('data-handle')||0)===handle);
}
function confirmApplyToSlot(){
  if(!browserSelectedHandle)return;
  var t=tattooByHandle[browserSelectedHandle];
  if(!t)return;
  sendCmd({action:'applyToSlot',actorId:getActorId(),
    section:t.section,name:t.name,domain:availableDomain,
    slot:ctxSlot,color:browserColor,alpha:browserAlphaV});

}

function syncPaletteHighlight(prefix,hex){
  var pal=document.getElementById(prefix+'Palette');
  if(!pal)return;
  var swatches=pal.querySelectorAll('.pal-swatch');
  for(var i=0;i<swatches.length;i++)
    swatches[i].classList.toggle('selected',i<SKYUI_PALETTE.length&&SKYUI_PALETTE[i].h.toLowerCase()===hex.toLowerCase());
}
function buildPalette(prefix){
  var html='';
  for(var i=0;i<SKYUI_PALETTE.length;i++){
    var c=SKYUI_PALETTE[i];
    html+='<div class="pal-swatch" title="'+esc(c.n)+'" style="background:'+c.h+'" onclick="pickColor(\''+prefix+'\','+i+')"></div>';
  }

function pickColor(prefix,idx){
  var c=SKYUI_PALETTE[idx];
  setColor(prefix,hexToInt(c.h));
}
function intToHex(n){
  var r=(n>>16)&0xFF,g=(n>>8)&0xFF,b=n&0xFF;
  return '#'+('00'+r.toString(16)).slice(-2)+('00'+g.toString(16)).slice(-2)+('00'+b.toString(16)).slice(-2);
}
function hexToInt(hex){
  return(parseInt(hex.slice(1,3),16)<<16)|(parseInt(hex.slice(3,5),16)<<8)|parseInt(hex.slice(5,7),16);
}

// ─── Tree ────────────────────────────────────────────────────────────────────
function buildTree(items){
  var tree={};
  for(var i=0;i<items.length;i++){
    var t=items[i];
    var sec=t.section||'(no section)';
    var area=t.area||'(no area)';
    if(!tree[sec])tree[sec]={};
    if(!tree[sec][area])tree[sec][area]=[];
    tree[sec][area].push(t);
  }
  return tree;
}
function renderTree(container,tree){
  var html='';
  var secKeys=Object.keys(tree);
  for(var si=0;si<secKeys.length;si++){
    var sec=secKeys[si];
    var areas=tree[sec];
    var sk='sec:'+sec;
    var open=expanded[sk]!==false;
    var tot=0;
    var akeys=Object.keys(areas);
    for(var ai=0;ai<akeys.length;ai++)tot+=areas[akeys[ai]].length;
    html+='<div class="tree-node" id="tn-'+escId(sk)+'">'+
      '<div class="tree-hdr" onclick="toggleNode('+JSON.stringify(sk).replace(/"/g,'&quot;')+')">'+
        '<span class="tree-arrow">'+(open?'&#9660;':'&#9658;')+'</span>'+
        '<span class="tree-label">'+esc(sec)+'</span>'+
        '<span class="badge">'+tot+'</span>'+
      '</div>'+
      '<div class="tree-children" '+(open?'':'style="display:none"')+'>';
    for(var ai=0;ai<akeys.length;ai++){
      var area=akeys[ai];
      var tats=areas[area];
      var ak='area:'+sec+':'+area;
      var aopen=expanded[ak]!==false;
      var gridItems='';
      for(var ti=0;ti<tats.length;ti++){
        var t=tats[ti];
        var texAttr=t.texture?' data-tex="'+esc(t.texture)+'"':'';
        var ukey=(t.section||'')+':'+t.name;
        var usedSlots=slotUsageMap[ukey]||[];
        var inUseCls=usedSlots.length?(usedSlots.indexOf(ctxSlot)>=0&&ctxIsReplace?' in-use-current':' in-use'):'';
        var badges='';
        for(var bi=0;bi<usedSlots.length;bi++){
          var isCur=usedSlots[bi]===ctxSlot&&ctxIsReplace;
          badges+='<span class="slot-badge'+(isCur?' current':'')+'">S'+usedSlots[bi]+'</span>';
        }
        var badgeHtml=badges?'<div class="slot-badges">'+badges+'</div>':'';
        gridItems+='<div class="grid-item'+inUseCls+'" data-handle="'+(t.handle|0)+'" onclick="selectBrowserTattoo('+(t.handle|0)+')">'+
          '<div class="tat-thumb-wrap">'+
            '<canvas class="tat-thumb" width="100" height="100"'+texAttr+' style="opacity:0"></canvas>'+
            '<div class="tat-thumb-ph"><div class="ph-icon">&#128444;</div><div class="ph-err"></div></div>'+
            badgeHtml+
          '</div>'+
          '<div class="grid-name" title="'+esc(t.name||'')+'">'+esc(t.name||'?')+'</div>'+
        '</div>';
      }
      html+='<div class="tree-node" id="tn-'+escId(ak)+'">'+
        '<div class="tree-hdr" onclick="toggleNode('+JSON.stringify(ak).replace(/"/g,'&quot;')+')">'+
          '<span class="tree-arrow">'+(aopen?'&#9660;':'&#9658;')+'</span>'+
          '<span class="tree-sub-label">'+esc(area)+'</span>'+
          '<span class="badge">'+tats.length+'</span>'+
        '</div>'+
        '<div class="tree-children" '+(aopen?'':'style="display:none"')+'>'+
          '<div class="tat-grid">'+gridItems+'</div>'+
        '</div>'+
      '</div>';
    }
    html+='</div></div>';
  }
  container.innerHTML=html;
  var thumbs=container.querySelectorAll('.tat-thumb[data-tex]');
  for(var i=0;i<thumbs.length;i++)thumbObserver.observe(thumbs[i]);
}
function toggleNode(key){
  expanded[key]=!(expanded[key]!==false);
  var node=document.getElementById('tn-'+escId(key));
  if(!node)return;
  var ch=node.querySelector('.tree-children');
  var arrow=node.querySelector('.tree-hdr .tree-arrow');
  var open=expanded[key]!==false;
  if(ch)ch.style.display=open?'':'none';
  if(arrow)arrow.innerHTML=open?'&#9660;':'&#9658;';
  if(open){var thumbs=node.querySelectorAll('.tat-thumb[data-tex]');for(var i=0;i<thumbs.length;i++)thumbObserver.observe(thumbs[i]);}
}
function escId(s){return String(s).replace(/[^a-zA-Z0-9_-]/g,function(c){return '_'+c.charCodeAt(0)+'_';});}

// ─── Thumbnails ───────────────────────────────────────────────────────────────
var thumbCache={},thumbInFlight={};
var thumbObserver=new IntersectionObserver(function(entries){
  entries.forEach(function(e){if(e.isIntersecting){thumbObserver.unobserve(e.target);loadThumb(e.target);}});
},{rootMargin:'200px'});

function loadThumb(canvas){
  var path=canvas.dataset.tex;
  if(!path)return;
  if(thumbCache[path]==='err'){
    canvas.style.opacity='.15';
    var _ph=canvas.nextElementSibling;
    if(_ph){_ph.style.display='';var _e=_ph.querySelector('.ph-err');if(_e)_e.textContent=path;}
    return;
  }
  if(thumbCache[path]){drawThumb(canvas,thumbCache[path]);return;}
  if(thumbInFlight[path])return;
  thumbInFlight[path]=true;
  sendCmd({action:'getTexture',path:path});
}
function drawThumb(canvas,bmp){
  var ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(bmp,0,0,canvas.width,canvas.height);
  canvas.style.opacity='1';
  var ph=canvas.nextElementSibling;
  if(ph)ph.style.display='none';
}
function onTextureData(path,w,h,b64){
  var bin,u8;
  try{bin=atob(b64);u8=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);}
  catch(e){delete thumbInFlight[path];thumbCache[path]='err';onTextureError(path);return;}
  createImageBitmap(new ImageData(new Uint8ClampedArray(u8.buffer),w,h)).then(function(bmp){
    delete thumbInFlight[path];
    thumbCache[path]=bmp;
    var canvases=document.querySelectorAll('canvas[data-tex]');
    for(var i=0;i<canvases.length;i++){if(canvases[i].dataset.tex===path)drawThumb(canvases[i],bmp);}
  }).catch(function(){
    delete thumbInFlight[path];
    thumbCache[path]='err';
    onTextureError(path);
  });
}
function onTextureError(path){
  delete thumbInFlight[path];
  thumbCache[path]='err';
  var canvases=document.querySelectorAll('canvas[data-tex]');
  for(var i=0;i<canvases.length;i++){
    if(canvases[i].dataset.tex===path){
      canvases[i].style.opacity='.15';
      var ph=canvases[i].nextElementSibling;
      if(ph){ph.style.display='';var e=ph.querySelector('.ph-err');if(e)e.textContent=path;}
    }
  }
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function setStatus(msg,cls){
  var el=document.getElementById('statusbar');
  el.textContent=msg;el.className=cls||'';
}
function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

(function(){
  var app=document.getElementById('app');
  var hdr=document.querySelector('header');
  try{
    var saved=localStorage.getItem('stui_pos');
    if(saved){
      var p=JSON.parse(saved);
      app.style.right='auto';
      app.style.left=Math.max(0,Math.min(p.x,window.innerWidth-app.offsetWidth))+'px';
      app.style.top=Math.max(0,Math.min(p.y,window.innerHeight-app.offsetHeight))+'px';
    }
  }catch(e){}
  var drag=false,ox=0,oy=0;
  hdr.addEventListener('mousedown',function(e){
    if(e.target.closest('button,select,input'))return;
    drag=true;ox=e.clientX-app.offsetLeft;oy=e.clientY-app.offsetTop;
    app.classList.add('dragging');e.preventDefault();
  });
  document.addEventListener('mousemove',function(e){
    if(!drag)return;
    app.style.right='auto';
    app.style.left=Math.max(0,Math.min(e.clientX-ox,window.innerWidth-app.offsetWidth))+'px';
    app.style.top=Math.max(0,Math.min(e.clientY-oy,window.innerHeight-app.offsetHeight))+'px';
  });
  document.addEventListener('mouseup',function(){
    if(!drag)return;drag=false;app.classList.remove('dragging');
    try{localStorage.setItem('stui_pos',JSON.stringify({x:app.offsetLeft,y:app.offsetTop}));}catch(e){}
  });
})();

// ─── Init ────────────────────────────────────────────────────────────────────
window.addEventListener('keydown',function(e){
  if(e.key==='Escape'||e.keyCode===27){e.preventDefault();resetToSlots();}
});

document.addEventListener('DOMContentLoaded',function(){
  buildPalette('edit');
  buildPalette('browser');
  var container=document.getElementById('slotScrollArea');
  for(var i=0;i<AREAS.length;i++){
    var area=AREAS[i];
    var sec=document.createElement('div');
    sec.className='area-section';sec.id='area-sec-'+area;
    var hdr=document.createElement('div');hdr.className='area-hdr';
    (function(a){hdr.onclick=function(){areaCollapsed[a]=!areaCollapsed[a];updateAreaSection(a);};})(area);
    hdr.innerHTML='<span class="area-arrow">&#9660;</span><span class="area-label">'+area+'</span><span class="area-loading">Loading…</span>';
    sec.appendChild(hdr);
    container.appendChild(sec);
  }
});
