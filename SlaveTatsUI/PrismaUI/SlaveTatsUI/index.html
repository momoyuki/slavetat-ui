<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SlaveTats UI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: rgba(10, 10, 10, 0.88);
    color: #e8e8e8;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    background: rgba(30,30,30,0.95);
    padding: 10px 16px;
    border-bottom: 1px solid #333;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.5px; }
  .tabs {
    display: flex;
    gap: 4px;
    padding: 8px 12px;
    background: rgba(20,20,20,0.8);
    border-bottom: 1px solid #2a2a2a;
  }
  .tab {
    padding: 5px 14px;
    font-size: 12px;
    border: 1px solid #383838;
    border-radius: 4px;
    background: transparent;
    color: #aaa;
    cursor: pointer;
  }
  .tab.active { background: #b05020; border-color: #c06030; color: #fff; }
  .panel { display: none; flex: 1; overflow-y: auto; padding: 12px; }
  .panel.active { display: flex; flex-direction: column; gap: 8px; }

  /* Actor picker */
  .actor-bar {
    display: flex;
    gap: 8px;
    align-items: center;
    background: rgba(255,255,255,0.04);
    border: 1px solid #2a2a2a;
    border-radius: 6px;
    padding: 8px 10px;
  }
  .actor-bar label { font-size: 11px; color: #888; white-space: nowrap; }
  .actor-bar select {
    flex: 1;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 4px;
    color: #e8e8e8;
    font-size: 12px;
    padding: 4px 6px;
  }

  /* Search */
  .search-bar {
    display: flex;
    gap: 6px;
  }
  .search-bar input {
    flex: 1;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 4px;
    color: #e8e8e8;
    font-size: 12px;
    padding: 6px 8px;
  }
  .search-bar input::placeholder { color: #555; }

  /* Tattoo list */
  .tat-list { display: flex; flex-direction: column; gap: 4px; }
  .tat-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.03);
    border: 1px solid #252525;
    border-radius: 5px;
    padding: 7px 10px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.1s;
  }
  .tat-item:hover { background: rgba(255,255,255,0.07); }
  .tat-item .tat-name { flex: 1; }
  .tat-item .tat-section { color: #666; font-size: 11px; }
  .tat-item .tat-area {
    font-size: 10px;
    background: #222;
    border: 1px solid #333;
    border-radius: 3px;
    padding: 1px 5px;
    color: #888;
  }
  .tat-item .btn-sm {
    padding: 3px 8px;
    font-size: 11px;
    border-radius: 3px;
    border: 1px solid #444;
    cursor: pointer;
    background: #2a2a2a;
    color: #ccc;
  }
  .tat-item .btn-sm:hover { background: #b05020; border-color: #c06030; color: #fff; }
  .tat-item .btn-remove { border-color: #5a1010; }
  .tat-item .btn-remove:hover { background: #8b1010; border-color: #bb2020; }

  /* Section headers */
  .section-hdr {
    font-size: 10px;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 4px 0 2px;
    border-bottom: 1px solid #1e1e1e;
    margin-top: 4px;
  }

  /* Buttons */
  .btn {
    padding: 6px 14px;
    font-size: 12px;
    border-radius: 4px;
    border: 1px solid #444;
    cursor: pointer;
    background: #2a2a2a;
    color: #e0e0e0;
  }
  .btn:hover { background: #383838; }
  .btn.primary { background: #b05020; border-color: #c06030; color: #fff; }
  .btn.primary:hover { background: #c06030; }

  /* Status bar */
  .statusbar {
    padding: 5px 12px;
    font-size: 11px;
    color: #555;
    background: rgba(10,10,10,0.9);
    border-top: 1px solid #1e1e1e;
  }
  .statusbar.ok   { color: #4a9; }
  .statusbar.err  { color: #c55; }
  .statusbar.busy { color: #99a; }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 32px;
    color: #444;
    font-size: 12px;
  }
</style>
</head>
<body>

<header>
  <h1>SlaveTats UI</h1>
  <div class="actor-bar" style="flex:1">
    <label>Target</label>
    <select id="actorSelect">
      <option value="0x14">Player</option>
    </select>
  </div>
  <button class="btn" onclick="syncTattoos()">Sync</button>
  <button class="btn" onclick="slavetatsCmd({action:'toggleUI'})">Close</button>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('available', this)">Available</button>
  <button class="tab" onclick="switchTab('applied', this)">Applied</button>
</div>

<div id="panel-available" class="panel active">
  <div class="search-bar">
    <input id="searchAvail" type="text" placeholder="Search tattoos..." oninput="renderAvailable()">
    <button class="btn primary" onclick="fetchAvailable()">Refresh</button>
  </div>
  <div id="listAvailable" class="tat-list">
    <div class="empty">Press Refresh to load available tattoos</div>
  </div>
</div>

<div id="panel-applied" class="panel">
  <div style="display:flex;gap:6px">
    <input id="searchApplied" type="text" placeholder="Filter..." style="flex:1;background:#1a1a1a;border:1px solid #333;border-radius:4px;color:#e8e8e8;font-size:12px;padding:6px 8px" oninput="renderApplied()">
    <button class="btn primary" onclick="fetchApplied()">Refresh</button>
  </div>
  <div id="listApplied" class="tat-list">
    <div class="empty">Press Refresh to load applied tattoos</div>
  </div>
</div>

<div id="statusbar" class="statusbar">Ready</div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
let availableTattoos = [];
let appliedTattoos   = [];

// ── PrismaUI interop ──────────────────────────────────────────────────────────
// Called by C++ via InteropCall("slavetatsOnData", jsonString)
function slavetatsOnData(jsonStr) {
  let data;
  try { data = JSON.parse(jsonStr); } catch(e) { setStatus('JSON parse error: ' + e, 'err'); return; }

  switch (data.type) {
    case 'ready':
      setStatus('Connected to SlaveTatsNG', 'ok');
      fetchAvailable();
      fetchApplied();
      break;
    case 'available':
      availableTattoos = data.tattoos || [];
      renderAvailable();
      setStatus(`${availableTattoos.length} tattoos available`, 'ok');
      break;
    case 'applied':
      appliedTattoos = data.tattoos || [];
      renderApplied();
      setStatus(`${appliedTattoos.length} tattoos applied`, 'ok');
      break;
    case 'success':
      setStatus(`OK: ${data.action}`, 'ok');
      // Refresh applied list after any write
      if (['addTattoo','removeTattoo','syncTattoos'].includes(data.action))
        fetchApplied();
      break;
    case 'error':
      setStatus('Error: ' + data.message, 'err');
      break;
  }
}

// Send command to C++ bridge
function slavetatsCmd(obj) {
  // PrismaUI JS → C++: call the registered listener named "slavetatsCmd"
  window.prisma?.send('slavetatsCmd', JSON.stringify(obj));
}

// ── Commands ──────────────────────────────────────────────────────────────────
function fetchAvailable() {
  setStatus('Loading available tattoos...', 'busy');
  slavetatsCmd({ action: 'queryAvailable', domain: 'default' });
}

function fetchApplied() {
  const actorId = parseInt(document.getElementById('actorSelect').value, 16);
  setStatus('Loading applied tattoos...', 'busy');
  slavetatsCmd({ action: 'queryApplied', actorId });
}

function addTattoo(section, name) {
  const actorId = parseInt(document.getElementById('actorSelect').value, 16);
  setStatus(`Adding ${section}/${name}...`, 'busy');
  slavetatsCmd({ action: 'addTattoo', actorId, section, name, color: 0, alpha: 1.0 });
}

function removeTattoo(section, name) {
  const actorId = parseInt(document.getElementById('actorSelect').value, 16);
  setStatus(`Removing ${section}/${name}...`, 'busy');
  slavetatsCmd({ action: 'removeTattoo', actorId, section, name });
}

function syncTattoos() {
  const actorId = parseInt(document.getElementById('actorSelect').value, 16);
  slavetatsCmd({ action: 'syncTattoos', actorId });
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderAvailable() {
  const q     = document.getElementById('searchAvail').value.toLowerCase();
  const list  = document.getElementById('listAvailable');
  const items = availableTattoos.filter(t =>
    !q || t.name.toLowerCase().includes(q) || (t.section||'').toLowerCase().includes(q));

  if (!items.length) {
    list.innerHTML = `<div class="empty">${availableTattoos.length ? 'No matches' : 'No tattoos loaded'}</div>`;
    return;
  }

  // Group by section
  const sections = {};
  for (const t of items) {
    const sec = t.section || 'Unknown';
    if (!sections[sec]) sections[sec] = [];
    sections[sec].push(t);
  }

  list.innerHTML = Object.entries(sections).map(([sec, tats]) => `
    <div class="section-hdr">${esc(sec)}</div>
    ${tats.map(t => `
      <div class="tat-item">
        <span class="tat-name">${esc(t.name)}</span>
        <button class="btn-sm" onclick="addTattoo(${JSON.stringify(t.section)}, ${JSON.stringify(t.name)})">Apply</button>
      </div>`).join('')}
  `).join('');
}

function renderApplied() {
  const q    = document.getElementById('searchApplied').value.toLowerCase();
  const list = document.getElementById('listApplied');
  const items = appliedTattoos.filter(t =>
    !q || t.name.toLowerCase().includes(q) || (t.section||'').toLowerCase().includes(q));

  if (!items.length) {
    list.innerHTML = `<div class="empty">${appliedTattoos.length ? 'No matches' : 'No tattoos applied'}</div>`;
    return;
  }

  list.innerHTML = items.map(t => `
    <div class="tat-item">
      <span class="tat-name">${esc(t.name)}</span>
      <span class="tat-section">${esc(t.section||'')}</span>
      <span class="tat-area">${esc(t.area||'')}</span>
      ${t.locked ? '<span class="tat-area" style="color:#c55">🔒</span>' : ''}
      <button class="btn-sm btn-remove" onclick="removeTattoo(${JSON.stringify(t.section)}, ${JSON.stringify(t.name)})"
        ${t.locked ? 'disabled title="Locked"' : ''}>Remove</button>
    </div>`).join('');
}

// ── UI helpers ─────────────────────────────────────────────────────────────────
function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
}

function setStatus(msg, type = '') {
  const el = document.getElementById('statusbar');
  el.textContent = msg;
  el.className = 'statusbar ' + type;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
